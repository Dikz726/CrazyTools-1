<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelta Store | Digital Assets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #05060a; --accent-neon: #00f2ff; --card-bg: #0f1118; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding-top: 100px; padding-bottom: 40px; min-height: 100vh; }

        /* CSS Navbar */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; z-index: 1000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { color: white; font-size: 24px; font-weight: 700; text-decoration: none; letter-spacing: 1px; }
        .nav-links { list-style: none; display: flex; }
        .nav-links li { position: relative; margin-left: 20px; }
        .nav-links li a { color: white; text-decoration: none; font-weight: 500; padding: 8px 12px; display: block; border-radius: 5px; transition: 0.3s; }
        .nav-links li a:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--accent-neon); }
        .dropdown-content { position: absolute; top: 100%; right: 0; min-width: 180px; background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px 0; opacity: 0; visibility: hidden; transition: 0.3s; }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; }
        .dropdown-content a { padding: 10px 15px !important; font-size: 0.9rem; }
        .dropdown-content a:hover { background: rgba(0, 242, 255, 0.1) !important; color: var(--accent-neon) !important; }

        /* Store Content */
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        h1 { text-align: center; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 10px var(--accent-neon); }
        .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .cat-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent-neon); background: transparent; color: var(--accent-neon); cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .cat-btn.active { background: var(--accent-neon); color: black; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid #1e293b; border-radius: 12px; padding: 12px; transition: 0.3s; animation: fadeIn 0.5s ease; display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--accent-neon); box-shadow: 0 0 15px var(--accent-neon); transform: scale(1.02); }
        .btn-detail { width: 100%; padding: 8px; background: transparent; border: 1px solid var(--accent-neon); border-radius: 6px; cursor: pointer; color: var(--accent-neon); margin-top: auto; text-decoration: none; text-align: center; display: block; }
        .btn-detail:hover { background: var(--accent-neon); color: black; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body> 
    <nav class="navbar">
        <a href="Portofolio.html" class="logo">Dikz.Web</a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house-user"></i> Home</a></li>
            <li class="dropdown">
                <a href="#" class="dropbtn"><i class="fa-solid fa-share-nodes"></i> Social Media <i class="fa-solid fa-arrow-down"></i></a>
                <div class="dropdown-content">
                    <a href="https://www.instagram.com/dik.whydn?igsh=MTRkbHQxcnlxb20zOQ==" target="_blank"><i class="fa-brands fa-instagram"></i> Instagram ⤶</a>
                    <a href="https://www.tiktok.com/@fdikiwahyudin?_t=ZS-90j4WsXjA87&_r=1" target="_blank"><i class="fa-brands fa-tiktok"></i> Tiktok ⤶</a>
                    <a href="https://www.facebook.com/share/1D2dwnJ7a6/" target="_blank"><i class="fa-brands fa-facebook"></i> Facebook ⤶</a>
                    <a href="https://t.me/ZeltaSparkle" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram ⤶</a>
                </div>
            </li>
            <li class="dropdown">
                <a href="#" class="dropbtn"><i class="fa-solid fa-medal"></i> About Me <i class="fa-solid fa-arrow-down"></i></a>
                <div class="dropdown-content">
                    <a href="CONTACT.html"><i class="fa-solid fa-envelope"></i> Contact Me!</a>
                    <a href="Portofolio.html"><i class="fa-solid fa-user"></i> Portofolio</a>
                    <a href="RATING.html"><i class="fa-solid fa-star-half-stroke"></i> Rating</a>
                    <a href="DONATE.html"><i class="fa-solid fa-hand-holding-medical"></i> Support Me </a>
                </div>
            </li>
        </ul>
    </nav>

    <div class="container">
        <h1>Zelta Store</h1>
        <div class="categories">
            <button class="cat-btn active" onclick="filterProducts('Semua', this)">Semua</button>
            <button class="cat-btn" onclick="filterProducts('Edit', this)">Edit/Desain</button>
            <button class="cat-btn" onclick="filterProducts('Template', this)">Template</button>
        </div>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const allProducts = [
            { name: "Preset Aesthetic", price: 25000, cat: "Edit" }, { name: "Notion Template", price: 35000, cat: "Template" },
            { name: "Canva Pro", price: 50000, cat: "Edit" }, { name: "Overlay Pack", price: 20000, cat: "Edit" },
            { name: "Lightroom", price: 30000, cat: "Edit" }, { name: "UI Kit", price: 75000, cat: "Template" },
            { name: "Icon Set", price: 25000, cat: "Edit" }, { name: "Font Bundle", price: 40000, cat: "Edit" },
            { name: "Music Bg", price: 15000, cat: "Template" }, { name: "Sound FX", price: 20000, cat: "Template" },
            { name: "Web Template", price: 99000, cat: "Template" }, { name: "Social Media", price: 45000, cat: "Template" },
            { name: "Business Card", price: 30000, cat: "Template" }, { name: "Logo Concept", price: 80000, cat: "Edit" },
            { name: "Vector", price: 35000, cat: "Edit" }, { name: "Pattern", price: 25000, cat: "Edit" },
            { name: "Brush", price: 20000, cat: "Edit" }, { name: "3D Model", price: 150000, cat: "Template" },
            { name: "E-book", price: 50000, cat: "Template" }, { name: "Mockup", price: 35000, cat: "Template" }
        ];

        function filterProducts(cat, btn) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const filtered = (cat === 'Semua') ? allProducts : allProducts.filter(p => p.cat === cat);
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div style="background:#1e293b; height:100px; border-radius:8px; margin-bottom:10px;"></div>
                        <p>${item.name}</p>
                        <div style="color:var(--accent-neon); margin: 5px 0; font-size: 0.9rem;">Rp ${item.price.toLocaleString()}</div>
                        <a href="product.html?name=${encodeURIComponent(item.name)}&price=${item.price}" class="btn-detail">Lihat Detail</a>
                    </div>
                `;
            });
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        filterProducts('Semua', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
